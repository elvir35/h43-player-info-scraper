<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H43 Lund Squad Mockup</title>
  <style>
    :root {
      color-scheme: light;
      --h43-blue: #075da7;
      --h43-blue-light: #8dd2ff;
      --h43-blue-dark: #064f90;
      --h43-navy: #001733;
      --h43-navy-2: #00285c;
      --h43-ink: #182033;
      --h43-muted: #667085;
      --h43-line: #d7def5;
      --h43-page: #f5f7fb;
      --h43-surface: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--h43-page);
      color: var(--h43-ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    .h43-page {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .h43-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--h43-line);
      padding-bottom: 18px;
    }

    .h43-title {
      margin: 0;
      color: var(--h43-blue-dark);
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
    }

    .h43-subtitle {
      margin: 8px 0 0;
      color: var(--h43-muted);
      font-size: 16px;
    }

    .h43-counts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      font-size: 14px;
      color: var(--h43-blue-dark);
    }

    .h43-count {
      border: 1px solid var(--h43-line);
      background: var(--h43-surface);
      padding: 8px 10px;
      font-weight: 700;
    }

    .h43-section {
      margin-top: 34px;
    }

    .h43-section-title {
      margin: 0 0 16px;
      color: var(--h43-blue-dark);
      font-size: 24px;
      line-height: 1.2;
    }

    .h43-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 30px;
    }

    .h43-card {
      position: relative;
      display: grid;
      grid-template-rows: auto auto;
      min-height: 100%;
      border: 16px solid var(--h43-blue-dark);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(20, 108, 204, 0.35), transparent 34%),
        radial-gradient(circle at 72% 18%, rgba(35, 145, 255, 0.34), transparent 34%),
        linear-gradient(160deg, var(--h43-navy), var(--h43-navy-2) 55%, #00142e);
      box-shadow: 0 24px 42px rgba(7, 37, 86, 0.28);
      overflow: hidden;
    }

    .h43-photo-wrap {
      position: relative;
      margin: 8px 8px 0;
      border: 2px solid rgba(43, 152, 255, 0.7);
      border-bottom: 0;
      border-radius: 22px 22px 0 0;
      background:
        radial-gradient(circle at 50% 18%, rgba(33, 141, 255, 0.22), transparent 34%),
        linear-gradient(140deg, rgba(4, 86, 163, 0.52), transparent 45%),
        #020b17;
      aspect-ratio: 0.82;
      overflow: hidden;
    }

    .h43-photo-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, transparent 0 44%, rgba(43, 152, 255, 0.18) 44% 45%, transparent 45%),
        radial-gradient(circle at 18% 48%, rgba(125, 207, 255, 0.14) 0 1px, transparent 1.5px);
      background-size: auto, 9px 9px;
      opacity: 0.82;
      pointer-events: none;
    }

    .h43-photo {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .h43-top-number {
      position: absolute;
      z-index: 2;
      top: 18px;
      right: 18px;
      color: #ffffff;
      font-size: 48px;
      font-weight: 900;
      line-height: 0.9;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
    }

    .h43-info {
      display: grid;
      gap: 12px;
      margin: 0 8px 8px;
      min-height: 190px;
      padding: 18px 24px 20px;
      border: 2px solid rgba(43, 152, 255, 0.7);
      border-top: 1px solid rgba(43, 152, 255, 0.7);
      border-radius: 0 0 22px 22px;
      background: linear-gradient(180deg, rgba(0, 34, 79, 0.96), rgba(0, 13, 33, 0.98));
      color: #ffffff;
    }

    .h43-name-block {
      margin: 0;
      text-transform: uppercase;
    }

    .h43-first-name {
      display: block;
      color: #399fff;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .h43-last-name {
      display: block;
      margin-top: 3px;
      color: #ffffff;
      font-size: clamp(28px, 3.2vw, 38px);
      font-weight: 900;
      line-height: 0.95;
      overflow-wrap: anywhere;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    }

    .h43-stat-list {
      display: grid;
      gap: 0;
      border-top: 1px solid rgba(43, 152, 255, 0.22);
    }

    .h43-field {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) max-content;
      gap: 12px;
      align-items: center;
      margin: 0;
      padding: 9px 0;
      border-bottom: 1px solid rgba(43, 152, 255, 0.2);
      font-size: 14px;
      line-height: 1.2;
      text-align: left;
      justify-items: start;
    }

    .h43-icon {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      color: #46a8ff;
    }

    .h43-icon svg {
      display: block;
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .h43-icon-fill svg {
      fill: currentColor;
      stroke: currentColor;
    }

    .h43-label {
      color: #46a8ff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: left;
    }

    .h43-value {
      min-width: 0;
      color: #ffffff;
      font-weight: 800;
      overflow-wrap: anywhere;
      justify-self: end;
      text-align: right;
    }

    .h43-value-muted {
      color: rgba(255, 255, 255, 0.78);
      font-weight: 700;
    }

    .h43-error {
      border: 2px solid #c81e1e;
      background: #fff5f5;
      color: #7f1d1d;
      padding: 16px;
    }

    @media (max-width: 620px) {
      .h43-page {
        width: min(100% - 20px, 1180px);
        padding-top: 20px;
      }

      .h43-header {
        align-items: start;
        flex-direction: column;
      }

      .h43-counts {
        justify-content: flex-start;
      }

      .h43-grid {
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 18px;
      }

      .h43-card {
        border-width: 12px;
        border-radius: 26px;
      }

      .h43-info {
        min-height: 174px;
        padding: 15px 16px 17px;
      }

      .h43-field {
        grid-template-columns: 28px minmax(0, 1fr) max-content;
        gap: 8px;
        font-size: 12px;
      }

      .h43-top-number {
        top: 14px;
        right: 16px;
        font-size: 38px;
      }
    }
  </style>
</head>
<body>
  <main class="h43-page">
    <header class="h43-header">
      <div>
        <h1 class="h43-title">H43 Lund</h1>
        <p class="h43-subtitle" id="h43-subtitle">Loading squad data...</p>
      </div>
      <div class="h43-counts" aria-label="Squad counts">
        <span class="h43-count" id="h43-player-count">Players: -</span>
        <span class="h43-count" id="h43-coach-count">Coaches: -</span>
      </div>
    </header>

    <section class="h43-section" aria-labelledby="players-title">
      <h2 class="h43-section-title" id="players-title">Players</h2>
      <div class="h43-grid" id="h43-players"></div>
    </section>

    <section class="h43-section" aria-labelledby="coaches-title">
      <h2 class="h43-section-title" id="coaches-title">Coaches</h2>
      <div class="h43-grid" id="h43-coaches"></div>
    </section>
  </main>

  <script>
    const DATA_URL = "data/players.json";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function personCard(person, type) {
      const role = type === "coach" ? person.role : person.position;
      const positionLabel = type === "coach" ? "Roll" : "Position";
      const positionValue = role || "-";
      const ageValue = Number.isInteger(person.age) ? `${person.age} år` : "-";
      const numberValue = type === "coach" ? "-" : (person.number || "-");
      const topValue = type === "coach" ? "L" : (person.number || "");
      const name = splitName(person.name);

      return `
        <article class="h43-card">
          <div class="h43-photo-wrap">
            ${topValue ? `<div class="h43-top-number">${escapeHtml(topValue)}</div>` : ""}
            ${person.image_url ? `
              <img class="h43-photo" src="${escapeHtml(person.image_url)}" alt="${escapeHtml(person.name)}" loading="lazy">
            ` : ""}
          </div>
          <div class="h43-info">
            <h3 class="h43-name-block">
              <span class="h43-first-name">${escapeHtml(name.first)}</span>
              <span class="h43-last-name">${escapeHtml(name.last)}</span>
            </h3>
            <div class="h43-stat-list">
              <p class="h43-field">
                <span class="h43-icon h43-icon-fill" aria-hidden="true">${iconPerson()}</span>
                <span class="h43-label">${escapeHtml(positionLabel)}</span>
                <span class="h43-value ${positionValue === "-" ? "h43-value-muted" : ""}">${escapeHtml(positionValue)}</span>
              </p>
              <p class="h43-field">
                <span class="h43-icon" aria-hidden="true">${iconCalendar()}</span>
                <span class="h43-label">Ålder</span>
                <span class="h43-value ${ageValue === "-" ? "h43-value-muted" : ""}">${escapeHtml(ageValue)}</span>
              </p>
              ${type === "player" ? `
                <p class="h43-field">
                  <span class="h43-icon" aria-hidden="true">${iconShirt()}</span>
                  <span class="h43-label">Tröjnummer</span>
                  <span class="h43-value ${numberValue === "-" ? "h43-value-muted" : ""}">${escapeHtml(numberValue)}</span>
                </p>
              ` : ""}
            </div>
          </div>
        </article>
      `;
    }

    function iconPerson() {
      return `<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"></circle><path d="M4 21v-2a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v2"></path></svg>`;
    }

    function iconCalendar() {
      return `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 9h18"></path><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01"></path></svg>`;
    }

    function iconShirt() {
      return `<svg viewBox="0 0 24 24"><path d="M8 4 4.5 6.2 2.5 10l3.2 2L8 9.8V21h8V9.8l2.3 2.2 3.2-2-2-3.8L16 4l-2 2h-4L8 4Z"></path></svg>`;
    }

    function splitName(fullName) {
      const parts = String(fullName || "").trim().split(/\s+/).filter(Boolean);
      if (parts.length <= 1) {
        return { first: parts[0] || "", last: "" };
      }
      return {
        first: parts[0],
        last: parts.slice(1).join(" ")
      };
    }

    fetch(DATA_URL)
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Could not load ${DATA_URL}`);
        }
        return response.json();
      })
      .then((data) => {
        const players = Array.isArray(data.players) ? data.players : [];
        const coaches = Array.isArray(data.coaches) ? data.coaches : [];
        const group = data.group || {};

        document.getElementById("h43-subtitle").textContent = [group.team, group.club].filter(Boolean).join(" · ");
        document.getElementById("h43-player-count").textContent = `Players: ${players.length}`;
        document.getElementById("h43-coach-count").textContent = `Coaches: ${coaches.length}`;
        document.getElementById("h43-players").innerHTML = players.map((player) => personCard(player, "player")).join("");
        document.getElementById("h43-coaches").innerHTML = coaches.map((coach) => personCard(coach, "coach")).join("");
      })
      .catch((error) => {
        document.querySelector(".h43-page").innerHTML = `<p class="h43-error">${escapeHtml(error.message)}</p>`;
      });
  </script>
</body>
</html>
